<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AWS CLF-C02 Exam Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #ff9900; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .markdown-section {
      max-width: 1100px;
      padding: 35px 45px;
    }
    .markdown-section h1 {
      font-size: 2.4rem;
      font-weight: 800;
      border-bottom: 2px solid #ff9900;
      padding-bottom: 12px;
    }
    .markdown-section h2 {
      margin-top: 45px;
      color: #ff9900;
      font-weight: 750;
    }
    .markdown-section h3 { color: #146eb4; }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      font-size: 0.92rem;
    }
    .markdown-section table th {
      background: #232f3e;
      color: white;
      font-weight: 700;
    }
    .markdown-section table td,
    .markdown-section table th {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
    }
    .markdown-section blockquote {
      border-left: 5px solid #ff9900;
      background: #fff7ed;
      color: #222;
      padding: 12px 18px;
      border-radius: 8px;
    }
    .hero {
      padding: 28px;
      border-radius: 18px;
      background: linear-gradient(135deg, #232f3e, #146eb4);
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      margin: 25px 0;
    }
    .hero h2 {
      color: white !important;
      margin-top: 0 !important;
    }
    code { border-radius: 6px; }
    .sidebar { border-right: 1px solid #e5e7eb; }
    .sidebar-nav strong { color: #ff9900; }
  </style>
</head>
<body>
  <div id="app">Loading AWS CLF-C02 Guide...</div>

  <script>
    window.$docsify = {
      name: 'AWS CLF-C02 Guide',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search notes...',
        noData: 'No results found.',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
